<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1b1d21">
<title>ChatNote · 对话式笔记</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <!-- 话题列表 -->
  <section id="screen-list" class="screen">
    <header class="topbar">
      <button class="icon-btn" id="btn-all-view" aria-label="全部会话">
        <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      </button>
      <h1>对话笔记</h1>
      <button class="icon-btn" id="btn-timeline-list" aria-label="时间线">☰</button>
      <button class="icon-btn" id="btn-settings" aria-label="设置">⚙︎</button>
    </header>
    <div class="topic-list" id="topic-list"></div>
    <div class="empty" id="list-empty" hidden>
      <div class="big">🗒️</div>
      <div>还没有话题<br>点击右下角的 ✎ 开始记录</div>
    </div>
    <button id="fab-new" aria-label="新建话题">＋</button>
    <button id="fab-quick" aria-label="快速记录">✎</button>
  </section>

  <!-- 对话 -->
  <section id="screen-chat" class="screen hide">
    <header class="topbar">
      <div class="chat-top-normal">
        <button class="icon-btn" id="btn-back" aria-label="返回">←</button>
        <div class="chat-title" id="chat-title" title="点击重命名"></div>
        <button class="icon-btn" id="btn-timeline-chat" aria-label="时间线">☰</button>
        <button class="icon-btn" id="btn-more" aria-label="更多">⋯</button>
      </div>
      <div class="chat-top-select" id="chat-top-select" hidden>
        <span class="sel-count" id="sel-count">已选 0</span>
        <button class="text-btn" id="btn-select-all">全选</button>
        <button class="text-btn" id="btn-fill-here">到这里</button>
        <button class="text-btn" id="btn-select-cancel">取消</button>
        <button class="icon-btn" id="btn-timeline-select" aria-label="时间线">☰</button>
      </div>
    </header>
    <div id="msg-area">
      <div id="msg-list"></div>
      <div class="empty" id="chat-empty" hidden>
        <div class="big">💬</div>
        <div>记录下第一条笔记吧</div>
      </div>
    </div>
    <footer id="composer">
      <div class="input-wrap">
        <div id="edit-tab" hidden><span>编辑中……</span><button id="btn-edit-cancel" aria-label="取消编辑">✕</button></div>
        <textarea id="input" rows="1" placeholder="输入笔记内容…"></textarea>
      </div>
      <div class="composer-actions">
        <button id="btn-collapse" hidden>收起</button>
        <button id="btn-send" disabled>发送</button>
      </div>
    </footer>
    <footer id="select-bar">
      <button class="bar-btn" id="btn-edit-selected" hidden>编辑</button>
      <button class="bar-btn" id="btn-copy-selected" hidden>复制</button>
      <button class="bar-btn" id="btn-del-selected" hidden>删除</button>
      <button class="bar-btn" id="btn-export-selected" disabled>导出（0）</button>
      <button class="bar-btn" id="btn-del-multi" disabled>删除所选</button>
    </footer>
  </section>

  <!-- 全部会话（合并视图） -->
  <section id="screen-all" class="screen hide">
    <header class="topbar">
      <button class="icon-btn" id="btn-all-back" aria-label="返回">←</button>
      <h1>全部会话</h1>
    </header>
    <div id="all-area">
      <div id="all-list"></div>
      <div class="empty" id="all-empty" hidden>
        <div class="big">💬</div>
        <div>还没有任何笔记</div>
      </div>
    </div>
    <footer id="all-composer">
      <div class="input-wrap">
        <textarea id="all-input" rows="1" placeholder="发送到默认会话…"></textarea>
      </div>
      <button id="all-send" disabled>发送</button>
    </footer>
  </section>
</div>

<!-- 操作菜单 -->
<div class="overlay" id="sheet-overlay" hidden>
  <div class="backdrop"></div>
  <div class="sheet" id="sheet"></div>
</div>

<!-- 导出面板 -->
<div class="overlay" id="export-overlay" hidden>
  <div class="backdrop"></div>
  <div class="sheet" id="export-sheet"></div>
</div>

<!-- 时间线 -->
<div class="overlay timeline-overlay" id="timeline-overlay" hidden>
  <div class="backdrop"></div>
  <div class="timeline-body">
    <header class="timeline-head">
      <span id="timeline-title">时间线</span>
      <button class="icon-btn" id="btn-timeline-close" aria-label="关闭时间线">✕</button>
    </header>
    <div class="timeline-stage" id="timeline-stage">
      <div class="tl-preview" id="tl-preview" hidden>
        <div class="tl-preview-name" id="tl-preview-name" hidden></div>
        <div class="tl-preview-bubble" id="tl-preview-bubble"></div>
      </div>
      <div class="tl-rail" id="tl-rail">
        <div class="tl-date-chip" id="tl-date-chip" hidden></div>
        <canvas id="tl-canvas"></canvas>
      </div>
    </div>
  </div>
</div>

<!-- 弹窗 -->
<div class="overlay" id="modal-overlay" hidden>
  <div class="backdrop"></div>
  <div class="modal">
    <h3 id="modal-title"></h3>
    <div id="modal-body"></div>
    <div class="modal-btns">
      <button id="modal-cancel">取消</button>
      <button id="modal-ok">确定</button>
    </div>
  </div>
</div>

<div id="fill-chip" hidden>← 左滑选择到当前</div>

<div id="toast" hidden></div>

<script src="app.js"></script>
</body>
</html>
