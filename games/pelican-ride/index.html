<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ff9d61">
<meta name="description" content="鹈鹕骑行 Pelican Ride —— 夕阳海岸的 3D 无尽骑行小游戏，纯静态网页。">
<title>鹈鹕骑行 · Pelican Ride</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23ff6b57'/%3E%3Cellipse cx='30' cy='30' rx='14' ry='17' fill='%23f9f5ea'/%3E%3Cpath d='M38 26 L58 32 L38 40 Q34 34 38 26 Z' fill='%23f2a03d'/%3E%3Ccircle cx='28' cy='22' r='3.4' fill='%23222'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<style>
:root{
  --coral:#ff6b57; --coral2:#ff8f5e; --teal:#1fb5a7; --sun:#ffcf6e;
  --ink:#243044; --card:rgba(18,25,46,.58); --card2:rgba(255,250,240,.9);
  --gold:#ffd45f;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{
  font-family:'Baloo 2','ZCOOL KuaiLe',ui-rounded,system-ui,'PingFang SC','Microsoft YaHei',sans-serif;
  background:#22315c;color:#fff;user-select:none;-webkit-user-select:none;touch-action:none;
}
#app{position:fixed;inset:0}
canvas{display:block}
.hidden{display:none!important}
.zk{font-family:'ZCOOL KuaiLe','Baloo 2',sans-serif;font-weight:400}
b{font-weight:800}

/* ---------- 载入页 ---------- */
#loader{position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;
  background:linear-gradient(180deg,#28376b 0%,#7a4d7e 55%,#ff9d61 100%);transition:opacity .7s;text-align:center;padding:0 24px}
#loader.done{opacity:0;pointer-events:none}
#load-spin{width:56px;height:56px;border-radius:50%;border:5px solid rgba(255,255,255,.25);border-top-color:#fff;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(1turn)}}
#load-text{font-size:17px;letter-spacing:1px;opacity:.95;text-shadow:0 2px 10px rgba(40,20,60,.4);line-height:1.7}
#load-text small{display:block;font-size:13px;opacity:.75}

/* ---------- 全局叠加 ---------- */
#vig{position:fixed;inset:0;pointer-events:none;z-index:5;
  background:radial-gradient(ellipse at 50% 42%,transparent 58%,rgba(24,18,46,.38) 100%)}
#flash{position:fixed;inset:0;pointer-events:none;z-index:6;background:rgba(255,60,50,.35);opacity:0}
#flash.on{animation:flashA .5s ease-out}
@keyframes flashA{0%{opacity:1}100%{opacity:0}}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;z-index:10}
#hearts{position:absolute;top:14px;left:16px;display:flex;gap:5px;font-size:27px;filter:drop-shadow(0 2px 4px rgba(30,20,50,.45))}
#hearts span.lost{filter:grayscale(1) brightness(.7);opacity:.35;transform:scale(.85)}
#score-wrap{position:absolute;top:8px;left:50%;transform:translateX(-50%);text-align:center}
#score{font-size:46px;font-weight:800;line-height:1;letter-spacing:1px;
  text-shadow:0 3px 0 rgba(36,26,60,.5),0 6px 18px rgba(36,26,60,.35)}
#score-lab{font-size:12px;letter-spacing:6px;opacity:.85;margin-top:-2px;text-shadow:0 1px 4px rgba(36,26,60,.5)}
#combo{margin-top:6px;opacity:0;transition:opacity .25s}
#combo.on{opacity:1}
#combo-x{display:inline-block;font-size:19px;font-weight:800;color:var(--gold);
  text-shadow:0 2px 0 rgba(90,50,10,.5);transform:rotate(-3deg)}
#combo-bar{width:110px;height:5px;border-radius:99px;background:rgba(255,255,255,.25);margin:3px auto 0;overflow:hidden}
#combo-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--sun),#ff9d5c);border-radius:99px}
#dist{position:absolute;top:16px;right:64px;font-size:17px;font-weight:700;padding:7px 14px;border-radius:99px;
  background:var(--card);backdrop-filter:blur(6px);box-shadow:0 3px 10px rgba(20,14,40,.25)}
#speedo{position:absolute;left:16px;bottom:16px;padding:9px 14px 11px;border-radius:16px;background:var(--card);
  backdrop-filter:blur(6px);box-shadow:0 3px 10px rgba(20,14,40,.25);min-width:104px}
#speed-row{display:flex;align-items:baseline;gap:5px}
#speed-row b{font-size:29px;line-height:1}
#speed-row span{font-size:11px;opacity:.8}
#speed-bar{height:5px;border-radius:99px;background:rgba(255,255,255,.22);margin-top:6px;overflow:hidden}
#speed-bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#7fd4e8,var(--sun),#ff6b57);transition:width .12s linear}
#buffs{position:absolute;top:64px;right:64px;display:flex;flex-direction:column;gap:7px;align-items:flex-end}
.buff{display:none;align-items:center;gap:7px;padding:5px 11px;border-radius:99px;background:var(--card);
  backdrop-filter:blur(6px);font-size:17px}
.buff.on{display:flex}
.buff i{display:block;width:44px;height:5px;border-radius:99px;background:rgba(255,255,255,.25);overflow:hidden}
.buff i b{display:block;height:100%;background:var(--gold);border-radius:99px}
#btn-pause{position:absolute;top:12px;right:14px;pointer-events:auto}
.icon-btn{width:44px;height:44px;border:none;border-radius:14px;background:var(--card);color:#fff;font-size:19px;
  backdrop-filter:blur(6px);cursor:pointer;box-shadow:0 3px 10px rgba(20,14,40,.25);transition:transform .15s,background .15s}
.icon-btn:hover{transform:scale(1.08);background:rgba(40,52,88,.72)}
.icon-btn:active{transform:scale(.94)}
#toasts{position:absolute;top:110px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{padding:9px 20px;border-radius:99px;background:var(--card);backdrop-filter:blur(8px);font-size:17px;font-weight:700;
  box-shadow:0 4px 14px rgba(20,14,40,.3);animation:toastA 2.2s ease forwards;white-space:nowrap}
.toast.gold{color:var(--gold)}
@keyframes toastA{0%{opacity:0;transform:translateY(-14px) scale(.85)}12%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0;transform:translateY(-8px)}}
#tut{position:absolute;bottom:86px;left:50%;transform:translateX(-50%);padding:9px 18px;border-radius:14px;background:var(--card);
  backdrop-filter:blur(6px);font-size:15px;animation:toastA 6s ease forwards;text-align:center}

/* ---------- 飘分 ---------- */
#pops{position:fixed;inset:0;pointer-events:none;z-index:9;overflow:hidden}
.pop{position:absolute;font-size:23px;font-weight:800;color:#fff;transform:translate(-50%,-50%);
  text-shadow:0 2px 0 rgba(36,26,60,.6),0 4px 12px rgba(36,26,60,.4);animation:popA .9s ease-out forwards}
.pop.gold{color:var(--gold)}
.pop.bad{color:#ff8f8f;font-size:20px}
@keyframes popA{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}15%{opacity:1;transform:translate(-50%,-60%) scale(1.15)}
  30%{transform:translate(-50%,-70%) scale(1)}100%{opacity:0;transform:translate(-50%,-150%) scale(.95)}}

/* ---------- 倒计时 ---------- */
#count{position:fixed;top:34%;left:50%;transform:translate(-50%,-50%);z-index:15;font-size:120px;pointer-events:none;
  font-family:'ZCOOL KuaiLe','Baloo 2',sans-serif;color:#fff;
  text-shadow:0 4px 0 rgba(200,80,60,.55),0 10px 30px rgba(40,20,60,.45)}
#count.zoom{animation:countA .8s ease-out}
@keyframes countA{0%{opacity:0;transform:translate(-50%,-50%) scale(1.9)}25%{opacity:1;transform:translate(-50%,-50%) scale(1)}
  75%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(.86)}}

/* ---------- 屏幕层 ---------- */
.screen{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:26px;padding:20px;background:radial-gradient(ellipse at 50% 60%,rgba(20,14,40,.18),rgba(20,14,40,.5));pointer-events:auto}
.card{background:var(--card);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.14);border-radius:28px;
  padding:30px 36px;display:flex;flex-direction:column;align-items:center;gap:16px;box-shadow:0 18px 50px rgba(15,10,35,.4);
  animation:cardIn .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes cardIn{0%{opacity:0;transform:translateY(26px) scale(.94)}100%{opacity:1;transform:none}}
.card h2{font-size:37px;letter-spacing:2px}
.btn{border:none;cursor:pointer;font-family:inherit;font-weight:800;font-size:21px;color:#fff;padding:14px 34px;border-radius:99px;
  background:linear-gradient(135deg,var(--coral),#ff9d4e);box-shadow:0 6px 0 rgba(180,60,40,.55),0 12px 26px rgba(200,70,40,.35);
  transition:transform .14s,box-shadow .14s,filter .2s;letter-spacing:2px}
.btn:hover{transform:translateY(-2px) scale(1.03);filter:brightness(1.06)}
.btn:active{transform:translateY(3px) scale(.98);box-shadow:0 2px 0 rgba(180,60,40,.55)}
.btn.big{font-size:25px;padding:17px 46px;animation:pulseB 2.2s ease-in-out infinite}
@keyframes pulseB{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.btn.ghost{background:rgba(255,255,255,.14);box-shadow:0 4px 0 rgba(20,16,40,.3);font-size:18px;padding:12px 26px}
.row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.col{display:flex;flex-direction:column;gap:12px;align-items:center}

/* 标题页 */
#logo{text-align:center;animation:floaty 3.4s ease-in-out infinite;pointer-events:none}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-12px) rotate(1deg)}}
#logo .big{font-size:min(88px,17vw);line-height:1.1;letter-spacing:8px;display:block;
  text-shadow:0 5px 0 rgba(190,70,60,.55),0 14px 34px rgba(40,20,60,.5)}
#logo .big em{font-style:normal;color:var(--gold)}
#logo .sub{display:block;margin-top:6px;font-size:15px;letter-spacing:7px;opacity:.92;text-shadow:0 2px 8px rgba(40,20,60,.5)}
#title-card{margin-top:4px}
.hints{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;font-size:13.5px;opacity:.95}
kbd{font-family:inherit;font-weight:700;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.25);
  border-bottom-width:3px;border-radius:8px;padding:2px 8px;font-size:12.5px;margin-right:3px}
.stat-line{font-size:15px;opacity:.9;letter-spacing:1px}
.opts{display:flex;gap:10px}
#credit{position:absolute;bottom:16px;font-size:12px;opacity:.7;letter-spacing:2px;pointer-events:none}
#title-tip{font-size:14px;opacity:.85}

/* 结算页 */
.ov-score{display:flex;flex-direction:column;align-items:center;line-height:1}
.ov-score span{font-size:64px;font-weight:800;color:var(--gold);text-shadow:0 4px 0 rgba(140,80,10,.4)}
.ov-score label,.ov-grid label{font-size:12px;letter-spacing:4px;opacity:.8;margin-top:4px}
.ov-grid{display:flex;gap:30px;text-align:center}
.ov-grid b{font-size:27px}
.new-badge{background:linear-gradient(135deg,var(--gold),#ff9d4e);color:#5a3408;font-weight:800;font-size:15px;
  padding:5px 16px;border-radius:99px;letter-spacing:2px;animation:pulseB 1.4s ease-in-out infinite}

/* ---------- 触屏按钮 ---------- */
#touch{position:fixed;inset:0;z-index:12;pointer-events:none}
.t-btn{pointer-events:auto;width:66px;height:66px;border-radius:50%;border:2px solid rgba(255,255,255,.3);
  background:rgba(24,32,58,.5);backdrop-filter:blur(4px);color:#fff;font-size:25px;font-family:inherit;font-weight:800}
.t-btn:active{background:rgba(255,140,90,.55);transform:scale(.92)}
.t-left{position:absolute;left:18px;bottom:26px;display:flex;gap:14px}
.t-right{position:absolute;right:18px;bottom:26px;display:flex;gap:12px;align-items:flex-end}
.t-btn.jump{width:84px;height:84px;font-size:33px;background:rgba(255,107,87,.5)}
.t-btn.small{width:52px;height:52px;font-size:19px}

@media (max-width:720px){
  #score{font-size:36px}
  #dist{right:60px;font-size:14px;top:60px}
  #buffs{top:104px;right:60px}
  #speedo{transform:scale(.85);transform-origin:left bottom}
  #logo .big{letter-spacing:4px}
  .card{padding:24px 22px}
  .ov-grid{gap:18px}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="vig"></div>
<div id="flash"></div>

<div id="loader">
  <div id="load-spin"></div>
  <div id="load-text">正在唤醒鹈鹕…<small>首次加载需要联网获取 3D 引擎</small></div>
</div>

<div id="hud" class="hidden">
  <div id="hearts"></div>
  <div id="score-wrap">
    <div id="score">0</div>
    <div id="score-lab">得 分</div>
    <div id="combo"><span id="combo-x">×1</span><div id="combo-bar"><i></i></div></div>
  </div>
  <div id="dist">🚩 <b id="dist-v">0</b> m</div>
  <div id="speedo">
    <div id="speed-row"><b id="speed-v">0</b><span>km/h</span></div>
    <div id="speed-bar"><i></i></div>
  </div>
  <div id="buffs">
    <div class="buff" id="buff-shield">🛡️ 护盾</div>
    <div class="buff" id="buff-magnet">🧲 <i><b></b></i></div>
    <div class="buff" id="buff-boost">⚡ <i><b></b></i></div>
  </div>
  <button id="btn-pause" class="icon-btn" aria-label="暂停">⏸</button>
  <div id="toasts"></div>
  <div id="tut" class="hidden">← → 移动 · 空格 跳跃（空中再按一次可展翅滑翔）</div>
</div>

<div id="pops"></div>
<div id="count" class="hidden"></div>

<div id="scr-title" class="screen">
  <div id="logo">
    <span class="big zk">鹈鹕<em>骑行</em></span>
    <span class="sub">PELICAN RIDE · 夕阳海岸</span>
  </div>
  <div class="card" id="title-card">
    <button id="btn-start" class="btn big">开始骑行 🚲</button>
    <div class="hints">
      <span><kbd>←</kbd><kbd>→</kbd>移动</span>
      <span><kbd>空格</kbd>跳跃 / 展翅</span>
      <span><kbd>S</kbd>刹车</span>
      <span><kbd>H</kbd>车铃</span>
      <span><kbd>P</kbd>暂停</span>
    </div>
    <div class="stat-line" id="best-line">🏆 最佳 0 分 · 最远 0 m</div>
    <div class="opts">
      <button id="btn-sound-t" class="icon-btn" aria-label="声音">🔊</button>
      <button id="btn-quality-t" class="icon-btn" aria-label="画质">✨</button>
    </div>
    <div id="title-tip">吃鱼得分 · 连吃有加成 · 小心路上的螃蟹</div>
  </div>
  <div id="credit">纯静态网页 · Three.js · 无需安装 · 双击即玩</div>
</div>

<div id="scr-over" class="screen hidden">
  <div class="card">
    <h2 class="zk">旅途结束</h2>
    <div id="ov-new" class="new-badge hidden">🏆 新纪录！</div>
    <div class="ov-score"><span id="ov-score">0</span><label>得分</label></div>
    <div class="ov-grid">
      <div><b id="ov-dist">0</b><label>距离 m</label></div>
      <div><b id="ov-fish">0</b><label>吃鱼 🐟</label></div>
      <div><b id="ov-best">0</b><label>最佳</label></div>
    </div>
    <div class="row">
      <button id="btn-again" class="btn">再骑一次 🚲</button>
      <button id="btn-home" class="btn ghost">主页</button>
    </div>
  </div>
</div>

<div id="scr-pause" class="screen hidden">
  <div class="card">
    <h2 class="zk">休息一下</h2>
    <div class="col">
      <button id="btn-resume" class="btn">继续骑行</button>
      <button id="btn-restart" class="btn ghost">重新开始</button>
      <button id="btn-home-p" class="btn ghost">回到主页</button>
    </div>
    <div class="opts">
      <button id="btn-sound-p" class="icon-btn" aria-label="声音">🔊</button>
      <button id="btn-quality-p" class="icon-btn" aria-label="画质">✨</button>
    </div>
  </div>
</div>

<div id="touch" class="hidden">
  <div class="t-left">
    <button id="btn-l" class="t-btn">◀</button>
    <button id="btn-r" class="t-btn">▶</button>
  </div>
  <div class="t-right">
    <button id="btn-bell" class="t-btn small">🔔</button>
    <button id="btn-brake" class="t-btn small">刹</button>
    <button id="btn-j" class="t-btn jump">⤒</button>
  </div>
</div>

<script type="text/plain" id="game-code">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import * as BUF from 'three/addons/utils/BufferGeometryUtils.js';

'use strict';
/* ================= 鹈鹕骑行 Pelican Ride =================
   单文件静态 3D 游戏：程序化建模 + 昼夜循环 + 生成式音乐 */
window.__GAME_READY__=false;

const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;
const damp=(a,b,l,dt)=>lerp(a,b,1-Math.exp(-l*dt));
const rand=(a=1,b)=>b===undefined?Math.random()*a:a+Math.random()*(b-a);
const randi=(a,b)=>Math.floor(rand(a,b+1));
const pick=a=>a[(Math.random()*a.length)|0];
const $=id=>document.getElementById(id);
const Q=new URLSearchParams(location.search);
const IS_TOUCH=('ontouchstart' in window)||navigator.maxTouchPoints>0;

const CONF={
  spawnZ:-175, killZ:16, roadHalf:4.7,
  baseSpeed:13, speedRamp:8.5, speedExp:1100,
  grav:22, jumpV:8.2, flapV:5.6,
  cycleLen:Math.max(10,parseFloat(Q.get('cycle'))||240),
};
const LS={
  get(k,d){ try{ const v=localStorage.getItem('pelicanRide.'+k); return v===null?d:JSON.parse(v); }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem('pelicanRide.'+k,JSON.stringify(v)); }catch(e){} },
};

const S={
  mode:'boot',            // boot|title|count|playing|paused|dying|over
  t:0, timeScale:1, tsTarget:1,
  speed:0, speedMul:1, dist:0,
  score:0, fish:0, combo:0, comboT:0,
  best:LS.get('best',0), bestDist:LS.get('bestDist',0), totalFish:LS.get('totalFish',0),
  hearts:3, invT:0, shield:false, magnetT:0, boostT:0,
  px:0, pvx:0, py:0, pvy:0, grounded:true, canFlap:true, jumpBuf:0,
  pedalPhase:0, blinkT:rand(2,4), blink:0, gulp:0, flapT:1,
  cycleT:parseFloat(Q.get('t'))||0.02, shake:0,
  countT:0, dieT:0, mileNext:500, inputs:0,
  tutDone:LS.get('tut',false), newRecord:false,
  quality:(Q.get('q')||(IS_TOUCH?'fast':'high'))=== 'high'?'high':'fast',
  muted:LS.get('muted',false),
  held:{l:false,r:false,brake:false},
};

/* ---------- DOM 引用 ---------- */
const D={};
['app','loader','load-spin','load-text','hud','hearts','score','combo','combo-x','combo-bar','dist-v',
 'speed-v','speed-bar','buff-shield','buff-magnet','buff-boost','btn-pause','toasts','tut','pops','count',
 'scr-title','btn-start','best-line','btn-sound-t','btn-quality-t','title-tip',
 'scr-over','ov-new','ov-score','ov-dist','ov-fish','ov-best','btn-again','btn-home',
 'scr-pause','btn-resume','btn-restart','btn-home-p','btn-sound-p','btn-quality-p',
 'touch','btn-l','btn-r','btn-j','btn-bell','btn-brake','flash'
].forEach(id=>{ D[id]=$(id); });
const comboBarI=D['combo-bar'].querySelector('i');
const magBarI=D['buff-magnet'].querySelector('b');
const boostBarI=D['buff-boost'].querySelector('b');
const speedBarI=D['speed-bar'].querySelector('i');

function show(el,on){ el.classList.toggle('hidden',!on); }
function loaderFail(msg){ window.__loaderFail&&window.__loaderFail(msg); }
/* ================= 音频：生成式音乐 + 音效 ================= */
const m2f=m=>440*Math.pow(2,(m-69)/12);
const CHORDS=[[48,52,55],[45,48,52],[41,45,48],[43,47,50]];
const PENT_M=[60,62,64,67,69,72,74,76,79,81];
const PENT_N=[57,60,62,64,67,69,72,74];

const AU={
  ctx:null,master:null,sfx:null,mus:null,windG:null,dsend:null,nz:null,
  timer:null,step:0,nextT:0,tempo:92,melIdx:3,night:false,
  ensure(){
    if(this.ctx){ if(this.ctx.state==='suspended') this.ctx.resume(); return true; }
    try{ const AC=window.AudioContext||window.webkitAudioContext; this.ctx=new AC(); }
    catch(e){ return false; }
    const c=this.ctx;
    this.master=c.createGain(); this.master.gain.value=S.muted?0:.9; this.master.connect(c.destination);
    this.sfx=c.createGain(); this.sfx.gain.value=.85; this.sfx.connect(this.master);
    this.mus=c.createGain(); this.mus.gain.value=.3; this.mus.connect(this.master);
    const d=c.createDelay(1); d.delayTime.value=60/this.tempo*.75;
    const fb=c.createGain(); fb.gain.value=.3;
    const wet=c.createGain(); wet.gain.value=.5;
    this.dsend=c.createGain(); this.dsend.gain.value=1;
    this.dsend.connect(d); d.connect(fb); fb.connect(d); d.connect(wet); wet.connect(this.mus);
    this.nz=c.createBuffer(1,c.sampleRate,c.sampleRate);
    const ch=this.nz.getChannelData(0);
    for(let i=0;i<ch.length;i++) ch[i]=Math.random()*2-1;
    const src=c.createBufferSource(); src.buffer=this.nz; src.loop=true;
    const lp=c.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=420;
    this.windG=c.createGain(); this.windG.gain.value=0;
    src.connect(lp); lp.connect(this.windG); this.windG.connect(this.master); src.start();
    return true;
  },
  setMute(m){ S.muted=m; LS.set('muted',m); if(this.master) this.master.gain.setTargetAtTime(m?0:.9,this.ctx.currentTime,.05); },
  tone(o){
    if(!this.ctx) return;
    const c=this.ctx, t=o.t??c.currentTime;
    const os=c.createOscillator(), g=c.createGain();
    os.type=o.type||'sine'; os.frequency.setValueAtTime(o.f||440,t);
    if(o.f1!==undefined) os.frequency.exponentialRampToValueAtTime(Math.max(20,o.f1),t+(o.dur||.2));
    const v=o.v??.2, a=o.a??.006, dur=o.dur||.2;
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(v,t+a);
    if(o.lin){ g.gain.linearRampToValueAtTime(0,t+dur); } else { g.gain.exponentialRampToValueAtTime(.0001,t+dur); }
    os.connect(g); g.connect(o.out||this.sfx); os.start(t); os.stop(t+dur+.06);
  },
  noise(o){
    if(!this.ctx) return;
    const c=this.ctx, t=o.t??c.currentTime, dur=o.dur||.2;
    const s=c.createBufferSource(); s.buffer=this.nz; s.loop=true;
    const fl=c.createBiquadFilter(); fl.type=o.type||'lowpass';
    fl.frequency.setValueAtTime(o.f||1000,t);
    if(o.f1!==undefined) fl.frequency.exponentialRampToValueAtTime(Math.max(30,o.f1),t+dur);
    fl.Q.value=o.q||1;
    const g=c.createGain(); g.gain.setValueAtTime(o.v??.2,t);
    g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    s.connect(fl); fl.connect(g); g.connect(o.out||this.sfx);
    s.start(t); s.stop(t+dur+.06);
  },
  /* ---- 音效 ---- */
  click(){ this.tone({f:900,f1:600,type:'square',dur:.05,v:.07}); },
  ding(){ const t=this.ctx?.currentTime;

    this.tone({f:1976,t,dur:.5,v:.16}); this.tone({f:2637,t:t+.02,dur:.4,v:.1}); this.tone({f:3951,t:t+.02,dur:.25,v:.05});
  },
  gulp(){ this.tone({f:320,f1:90,dur:.13,v:.2}); },
  chime(n){ const m=72+[0,2,4,7,9][n%5]+12*(Math.floor(n/5)%2);
    this.tone({f:m2f(m),type:'triangle',dur:.28,v:.15});

  jump(){ this.noise({f:500,f1:1600,dur:.16,v:.1,type:'bandpass',q:2}); this.tone({f:230,f1:450,dur:.14,v:.07}); },
  flap(){ this.noise({f:900,f1:300,dur:.14,v:.11}); },
  land(){ this.tone({f:95,f1:60,dur:.09,v:.16}); this.noise({f:350,dur:.07,v:.09}); },
  crash(){ this.noise({f:1600,f1:180,dur:.4,v:.4}); this.tone({f:160,f1:55,dur:.32,v:.35}); },
  splash(){ this.noise({f:900,f1:400,dur:.3,v:.22,type:'bandpass',q:1.4}); },
  boost(){ this.tone({f:200,f1:820,type:'sawtooth',dur:.4,v:.08}); this.noise({f:600,f1:2400,dur:.4,v:.08,type:'bandpass',q:3}); },
  heartS(){ const t=this.ctx?.currentTime; if(t===undefined)return;

  magnetS(){ const t=this.ctx?.currentTime; if(t===undefined)return;
    for(let i=0;i<4;i++) this.tone({f:500+i*160,t:t+i*.06,dur:.12,v:.08,type:'triangle'}); },
  shieldS(){ this.tone({f:900,f1:1400,dur:.25,v:.1}); this.tone({f:1350,f1:2100,dur:.25,v:.06,type:'triangle'}); },
  popS(){ this.tone({f:750,f1:200,dur:.16,v:.18}); this.noise({f:1200,dur:.1,v:.1,type:'bandpass',q:2}); },
  gull(v=.08){ const t=this.ctx?.currentTime; if(t===undefined)return;

  mile(){ const t=this.ctx?.currentTime; if(t===undefined)return;

  over(){ const t=this.ctx?.currentTime; if(t===undefined)return;
    [64,60,55,48].forEach((m,i)=>this.tone({f:m2f(m),type:'triangle',t:t+i*.3,dur:.5,v:.11,a:.02})); },
  tick(){ this.tone({f:660,dur:.08,v:.1,type:'square'}); },
  go(){ this.tone({f:520,f1:1040,dur:.3,v:.16,type:'triangle'}); },
  /* ---- 生成式配乐 ---- */
  startMusic(){
    if(!this.ctx||this.timer) return;
    this.step=0; this.nextT=this.ctx.currentTime+.1;
    this.timer=setInterval(()=>this.sched(),40);
  },
  sched(){
    if(!this.ctx) return;
    const ahead=this.ctx.currentTime+.2;
    while(this.nextT<ahead){ this.play8th(this.step,this.nextT); this.nextT+=60/this.tempo/2; this.step++; }
  },
  play8th(i,t){
    const bar=(i>>3)%4, e=i&7, tr=this.night?-4:0;
    if(e===0) for(const m of CHORDS[bar]) this.pad(m+tr,t);
    if(e===0||e===4) this.kick(t);
    if(e===2||e===6) this.hat(t);
    const pool=this.night?PENT_N:PENT_M;
    if(Math.random()<.5){
      this.melIdx=clamp(this.melIdx+randi(-2,2),0,pool.length-1);
      this.pluck(pool[this.melIdx]+tr,t);
    }
  },
  pad(m,t){ const f=m2f(m);
    this.tone({f,type:'triangle',t,dur:2.1,v:.05,a:.55,lin:true,out:this.mus});
    this.tone({f:f*1.004,type:'sine',t,dur:2.1,v:.032,a:.55,lin:true,out:this.mus});
  },
  kick(t){ this.tone({f:115,f1:42,t,dur:.13,v:.34,out:this.mus}); },
  hat(t){ this.noise({t,dur:.035,v:.045,f:7500,type:'highpass',out:this.mus}); },
  pluck(m,t){
    this.tone({f:m2f(m),type:'sine',t,dur:.32,v:.1,out:this.mus});
    this.tone({f:m2f(m),type:'sine',t,dur:.32,v:.08,out:this.dsend});
  },
  setWind(v){ if(this.windG) this.windG.gain.setTargetAtTime(clamp(v,0,1)*.24,this.ctx.currentTime,.3); },
};

{

    uniforms:{

      uSun:{value:new THREE.Color(0xffd9a3)}, uSunDir:{value:sky.sunDir}, uNight:{value:0},
    },
    vertexShader:`varying vec3 vW;
      void main(){ vec4 wp=modelMatrix*vec4(position,1.); vW=wp.xyz;
        gl_Position=projectionMatrix*viewMatrix*wp; }`,
    fragmentShader:`varying vec3 vW;
      uniform vec3 uTop,uHor,uSun,uSunDir; uniform float uNight;
      void main(){
        vec3 d=normalize(vW-cameraPosition);
        float h=clamp(d.y,0.,1.);
        vec3 col=mix(uTop,uHor,pow(1.-h,1.6));
        float sd=max(dot(d,normalize(uSunDir)),0.);
        col+=uSun*(pow(sd,6.)*.22+pow(sd,80.)*.6)*(1.-uNight*.9);
        col=mix(col,uHor*.5,smoothstep(0.,.12,-d.y));
        gl_FragColor=vec4(col,1.);
      }`,
  });

const CY={top:new THREE.Color(),hor:new THREE.Color(),sun:new THREE.Color(),fog:new THREE.Color(),
  hs:new THREE.Color(),hg:new THREE.Color(),dc:new THREE.Color(),deep:new THREE.Color(),hi2:new THREE.Color(),
  hi:0,di:0,night:0,el:0};
const _ca=new THREE.Color(), _cb=new THREE.Color();
function cset(key,hex){ CY[key].copy(_ca.setHex(hex)); }
function cycleSample(t){
  let i=0; while(i<STOPS.length-2&&STOPS[i+1].t<=t) i++;
  const a=STOPS[i], b=STOPS[i+1], u=clamp((t-a.t)/(b.t-a.t),0,1);
  for(const k of ['top','hor','sun','fog','hs','hg','dc','deep','hi2']){
    _ca.setHex(a[k]); _cb.setHex(b[k]); CY[k].copy(_ca).lerp(_cb,u);
  }
  CY.hi=lerp(a.hi,b.hi,u); CY.di=lerp(a.di,b.di,u);
  CY.night=lerp(a.night,b.night,u); CY.el=lerp(a.el,b.el,u);
}
function updateCycle(dt){
  S.cycleT=(S.cycleT+dt/CONF.cycleLen)%1;
  cycleSample(S.cycleT);
  sky.u.uTop.value.copy(CY.top); sky.u.uHor.value.copy(CY.hor);
  sky.u.uSun.value.copy(CY.sun); sky.u.uNight.value=CY.night;
  scene.fog.color.copy(CY.fog);
  hemi.color.copy(CY.hs); hemi.groundColor.copy(CY.hg); hemi.intensity=CY.hi;
  sunLight.color.copy(CY.dc); sunLight.intensity=CY.di;
  const az=-.62, el=CY.el*Math.PI/180;
  sky.sunDir.set(Math.cos(el)*Math.sin(az),Math.sin(el),-Math.cos(el)*Math.cos(az)).normalize();
  sky.sunDisc.position.copy(sky.sunDir).multiplyScalar(720);
  sky.sunGlow.position.copy(sky.sunDisc.position);
  const sunVis=clamp((CY.el+8)/10,0,1);
  sky.sunDisc.material.opacity=sunVis; sky.sunGlow.material.opacity=.5*sunVis;
  const mel=clamp(-CY.el*1.1,6,55)*Math.PI/180, maz=.7;
  sky.moonDir.set(Math.cos(mel)*Math.sin(maz),Math.sin(mel),-Math.cos(mel)*Math.cos(maz)).normalize();
  sky.moonDisc.position.copy(sky.moonDir).multiplyScalar(700);
  sky.moonGlow.position.copy(sky.moonDisc.position);
  sky.moonDisc.material.opacity=CY.night; sky.moonGlow.material.opacity=.35*CY.night;
  sky.stars.material.opacity=CY.night*.9;
  sky.group.position.copy(camera.position); // 穹顶跟随相机
  if(CY.el>1.5) sunLight.position.copy(sky.sunDir).multiplyScalar(70);
  else sunLight.position.copy(sky.moonDir).multiplyScalar(70);
  sunLight.target.position.set(0,0,-20);
  sky.night=CY.night;
  PAL.cloud.emissiveIntensity=(1-CY.night)*.55;
  AU.night=CY.night>.5;
  AU.tempo=AU.night?76:92;
  ocean&&ocean.setColors(CY.deep,CY.hi2,CY.fog,CY.night);
}

function propPool(n,span,builder,place){
  const arr=[];
  for(let i=0;i<n;i++){
    const g=builder(); g.userData.ph=rand(TAU); scene.add(g);
    const it={g,z:14-(i+rand(.8))*(span/n)};
    place(it); arr.push(it);
  }
  return { arr, place,
    update(dtw,sp){
      for(const it of arr){
        it.g.position.z+=sp*dtw;
        if(it.g.position.z>18){ it.g.position.z-=span; place(it); }
      }
    } };
}

const _va=new THREE.Vector3(),_vb=new THREE.Vector3(),_vd=new THREE.Vector3(),_vq=new THREE.Quaternion();
const UP=new THREE.Vector3(0,1,0);
function stretchLimbV(m,a,b,sx=1,sz=1){
  _vd.subVectors(b,a); const len=Math.max(_vd.length(),.001);
  m.position.copy(a).addScaledVector(_vd,.5);
  _vq.setFromUnitVectors(UP,_vd.multiplyScalar(1/len));
  m.quaternion.copy(_vq);
  m.scale.set(sx,len,sz);
}
function stretchLimb(m,ax,ay,az,bx,by,bz,sx,sz){
  _va.set(ax,ay,az); _vb.set(bx,by,bz); stretchLimbV(m,_va,_vb,sx,sz);
}
function limbGeo(r,r2=1){ return new THREE.CylinderGeometry(r,r*(r2||1),1,6); }
function ribbon(n,mat,seg,sx,sz,parent){
  const pts=[],meshes=[];
  for(let i=0;i<n;i++){
    pts.push(new THREE.Vector3());
    if(i>0){ const m=M(limbGeo(seg*.42),mat,0,0,0,parent); m.castShadow=false; meshes.push(m); }
  }
  return {pts,meshes,seg};
}
function updateRibbon(rb,anchor,t,flut,speedX,dt){
  rb.pts[0].copy(anchor);
  const L=rb.seg*(1+speedX*.02);
  for(let i=1;i<rb.pts.length;i++){
    _va.set(
      rb.pts[i-1].x+Math.sin(t*7+i*1.3)*L*.45*flut + speedX*.02*L,
      rb.pts[i-1].y+Math.sin(t*5.3+i*1.7)*L*.5*flut,
      rb.pts[i-1].z+L*(1+flut*.2));
    rb.pts[i].lerp(_va,1-Math.exp(-13*dt));
    _vb.subVectors(rb.pts[i],rb.pts[i-1]).setLength(rb.seg);
    rb.pts[i].copy(rb.pts[i-1]).add(_vb);
  }
  for(let i=1;i<rb.pts.length;i++)
    stretchLimbV(rb.meshes[i-1],rb.pts[i-1],rb.pts[i],1-i*.06,1-i*.06);
}

function poseRig(dt){
  const sp=S.speed, t=S.t, ph=S.pedalPhase;
  const idle=S.mode==='title';
  // 车轮 / 曲柄
  const spin=sp/.42;
  BIKE.wheelR.rotation.x-=spin*dt;
  BIKE.wheelF.rotation.x-=spin*dt;
  BIKE.crank.rotation.x=-ph;
  BIKE.pedalL.rotation.x=ph; BIKE.pedalR.rotation.x=ph;
  BIKE.ring.rotation.x=-ph*.55;
  BIKE.steer.rotation.y=damp(BIKE.steer.rotation.y,-S.pvx*.028,8,dt);
  // 侧倾 & 俯仰 & 弹跳
  const targetRoll=clamp(-S.pvx*.05,-.34,.34)+(idle?Math.sin(t*.7)*.03:0);
  TILT.rotation.z=damp(TILT.rotation.z,targetRoll,8,dt);
  TILT.rotation.x=damp(TILT.rotation.x,clamp(-S.pvy*.022,-.3,.22),10,dt);
  TILT.position.y=Math.abs(Math.sin(ph))*.035+Math.sin(t*9)*.006;
  // 着地挤压
  const sq=damp(TILT.scale.y,1,10,dt);
  TILT.scale.set(1+(1-sq)*.6,sq,1+(1-sq)*.6);
  // 踩踏：脚追踪踏板
  BIKE.pedalL.getWorldPosition(_p1); TILT.worldToLocal(_p1);
  BIKE.pedalR.getWorldPosition(_p2); TILT.worldToLocal(_p2);
  PEL.footL.position.set(_p1.x,_p1.y+.05,_p1.z+.02);
  PEL.footR.position.set(_p2.x,_p2.y+.05,_p2.z+.02);
  stretchLimb(PEL.legL,-.26,1.12,.24,_p1.x,_p1.y+.12,_p1.z+.02);
  stretchLimb(PEL.legR,.26,1.12,.24,_p2.x,_p2.y+.12,_p2.z+.02);
  // 翅膀：扶把 / 展翅
  S.flapT=Math.min(S.flapT+dt/.55,1);
  const flap=Math.sin(S.flapT*Math.PI)*(S.flapT<1?1:0);
  for(const side of [-1,1]){
    const sh={x:side*.3,y:1.55,z:.02};
    const el={x:side*(.52+flap*.1),y:1.3+flap*.45,z:-.12-flap*.1};
    const gp={x:side*.39+flap*side*.1,y:1.17+flap*.7+Math.sin(t*6)*.015,z:-.64-flap*.15};
    stretchLimb(side<0?PEL.wingUL:PEL.wingUR,sh.x,sh.y,sh.z,el.x,el.y,el.z,1.6,.45);
    stretchLimb(side<0?PEL.wingFL:PEL.wingFR,el.x,el.y,el.z,gp.x,gp.y,gp.z,1.5,.4);
  }
  // 头部
  const look=S.mode==='title'?Math.sin(t*.5)*.5:clamp(-S.pvx*.03,-.3,.3);
  PEL.head.rotation.y=damp(PEL.head.rotation.y,look,6,dt);
  PEL.head.rotation.z=damp(PEL.head.rotation.z,-S.pvx*.012,6,dt);
  PEL.head.position.y=2.04+Math.sin(ph*2)*.02;
  PEL.tail.rotation.x=Math.sin(t*7)*.08+clamp(sp*.004,0,.12);
  // 眨眼
  S.blinkT-=dt;
  if(S.blinkT<=0){ S.blink=.13; S.blinkT=rand(1.8,4.5); }
  if(S.blink>0){ S.blink-=dt; }
  const eyeS=S.blink>0?Math.max(.08,1-S.blink/.13):1;
  PEL.eyeL.scale.y=eyeS; PEL.eyeR.scale.y=eyeS;
  // 喉囊吞鱼脉冲
  S.gulp=Math.max(0,S.gulp-dt*3.2);
  PEL.pouch.scale.set(.16*(1+S.gulp*.5),.22*(1+S.gulp*.9),.3*(1+S.gulp*.6));
  // 围巾
  const flut=.6+sp*.05;
  updateRibbon(PEL.scarf,_p3.set(0,1.8,.1),t,flut,S.pvx,dt);
  updateRibbon(BIKE.streamL,_p3.set(-.42,1.17,-.64),t,flut*1.3,S.pvx,dt);
  updateRibbon(BIKE.streamR,_p3.set(.42,1.17,-.64),t,flut*1.3,S.pvx,dt);
  // 车铃余韵
  if(BIKE.bellS>0){ BIKE.bellS=Math.max(0,BIKE.bellS-dt*3);
    BIKE.bell.scale.setScalar(1+BIKE.bellS*.4); BIKE.bell.rotation.z=BIKE.bellS*.4*Math.sin(t*40); }
  // 夜间车灯
  const nightOn=sky.night>.35?1:0;
  BIKE.lens.material.emissiveIntensity=damp(BIKE.lens.material.emissiveIntensity,nightOn*1.6,4,dt);
  BIKE.spot.intensity=damp(BIKE.spot.intensity,nightOn*90,4,dt);
  BIKE.beam.material.opacity=damp(BIKE.beam.material.opacity,nightOn*.1,4,dt);
}

function director(){

  if(S.dist>=nextEvDist){
    const tier=tierOf(S.dist);
    const pool=PATTERNS.filter(p=>tier>=p.min);
    let tw=0; for(const p of pool) tw+=p.w+(tier>=p.min+1?2:0);
    let r=Math.random()*tw, chosen=pool[0];
    for(const p of pool){ r-=p.w+(tier>=p.min+1?2:0); if(r<=0){ chosen=p; break; } }
    const len=chosen.fn(CONF.spawnZ)||10;
    nextEvDist=S.dist+len+rand(chosen.gap[0],chosen.gap[1])*(1-tier*.07);
  }
  if(S.dist>=nextFishDist){
    fishRow(pickX(),CONF.spawnZ,randi(2,4));
    nextFishDist=S.dist+rand(30,55);
  }
  if(S.dist>=nextPadDist){
    spawnEnt('pad',pickX(),CONF.spawnZ);
    nextPadDist=S.dist+rand(200,320);
  }
  if(S.dist>=nextPickDist){
    const r=Math.random();
    const kind=r<.38?'shieldP':r<.68?'magnetP':(S.hearts<3?'heartP':'star');
    spawnEnt(kind,pickX(),CONF.spawnZ,{y:1.25});

        if(S.magnetT>0&&Math.abs(e.z)<9&&Math.abs(e.x-S.px)<8){
          e.x=damp(e.x,S.px,9,dtw); e.y=damp(e.y,S.py+1.5,6,dtw); e.z=damp(e.z,0,4,dtw);
        }else{
          e.y=e.by+Math.sin(S.t*3+e.ph)*.08;
        }
        m.position.set(e.x,e.y,e.z);
        m.rotation.y=Math.sin(S.t*6+e.ph)*.12;
        m.userData.tp.rotation.y=Math.sin(S.t*11+e.ph)*.5;
        break;
      }
      case 'crab':{
        e.x=e.bx+Math.sin(S.t*1.7+e.ph)*1.5;
        m.position.set(e.x,Math.abs(Math.sin(S.t*8+e.ph))*.04,e.z);
        m.rotation.y=Math.sin(S.t*1.7+e.ph)>0?0:Math.PI;
        const cs=m.userData.claws;
        cs[0].scale.y=1+Math.sin(S.t*10+e.ph)*.25; cs[1].scale.y=1+Math.cos(S.t*10+e.ph)*.25;
        break;
      }
      case 'ball':{
        e.x+=e.vx*dtw;
        if(e.x>4.2||e.x<-4.2) e.vx*=-1;
        m.position.set(e.x,e.y,e.z);
        m.rotation.x+=S.speed*dtw/.42;
        break;
      }
      case 'gull':{
        m.position.set(e.x+Math.sin(S.t*4+e.ph)*.5,1.55+Math.sin(S.t*3+e.ph)*.25,e.z);
        m.userData.wl.rotation.z=Math.sin(S.t*16)*.6;
        m.userData.wr.rotation.z=-Math.sin(S.t*16)*.6;
        break;
      }
      case 'star': case 'shieldP': case 'magnetP': case 'heartP':{
        e.y=e.by+Math.sin(S.t*2.4+e.ph)*.15;
        m.position.set(e.x,e.y,e.z);
        m.rotation.y+=dtw*2.2;
        break;
      }
      case 'puddle': case 'pad':{
        m.position.set(e.x,0,e.z);
        if(e.kind==='pad') m.material.opacity=.5+.3*Math.sin(S.t*6+e.ph);
        break;
      }
      default: m.position.set(e.x,e.y,e.z);
    }
    /* 碰撞检测 */
    if(S.mode==='playing'&&Math.abs(e.z)<(e.d/2+.85)){
      const dx=Math.abs(e.x-S.px), dz=Math.abs(e.z);
      if(!e.dmg){
        if(e.kind==='fish'||e.kind==='gold'){
          if(dx<(S.magnetT>0?2:1)&&dz<1.05&&Math.abs(mouthY-e.y)<.9){ collectFish(e,i); continue; }
        }else if(e.kind==='star'){
          if(dx<1.1&&dz<1.1&&Math.abs(mouthY-e.y)<1.1){ S.score+=60; popupAt(e.mesh.position,'+60 ⭐','gold');
            burst('spark',e.x,e.y,e.z,10); AU.mile(); releaseEnt(i); continue; }
        }else if(e.kind==='shieldP'){
          if(dx<1.2&&dz<1.2){ S.shield=true; AU.shieldS(); toast('🛡️ 护盾！'); burst('spark',e.x,e.y,e.z,12); releaseEnt(i); continue; }
        }else if(e.kind==='magnetP'){
          if(dx<1.2&&dz<1.2){ S.magnetT=8; AU.magnetS(); toast('🧲 磁铁吸鱼！'); burst('spark',e.x,e.y,e.z,12); releaseEnt(i); continue; }
        }else if(e.kind==='heartP'){
          if(dx<1.2&&dz<1.2){
            if(S.hearts<3){ S.hearts++; renderHearts(); toast('❤ +1'); }
            else { S.score+=100; popupAt(e.mesh.position,'+100','gold'); }
            AU.heartS(); burst('spark',e.x,e.y,e.z,12); releaseEnt(i); continue;
          }
        }else if(e.fx==='slow'&&!e.used&&dx<e.w/2+.5&&dz<e.d/2+.4){
          e.used=true; S.slowT=.9; AU.splash(); burst('splash',e.x,.3,e.z,8);
        }else if(e.fx==='boost'&&!e.used&&dx<e.w/2+.4&&dz<e.d/2+.4){
          e.used=true; S.boostT=3.4; AU.boost(); toast('⚡ 加速！','gold'); burst('spark',e.x,.8,e.z,14);
        }
      }else if(dx<e.w/2+.5&&dz<e.d/2+.6){
        const cleared=e.air?S.py>2.05:S.py>e.h-.04;
        if(!cleared){ hitObstacle(e); }
      }
    }
    if(e.z>CONF.killZ) releaseEnt(i);
  }
}

const PARTS=[];
const dustMat=std(0xb9a084,{roughness:1});
const sparkMat=new THREE.MeshBasicMaterial({color:0xffd45f,transparent:true,opacity:.9,blending:THREE.AdditiveBlending,depthWrite:false});
const splashMat=std(0xdff2ff,{roughness:.3});
const featherMat=new THREE.MeshStandardMaterial({color:0xf9f5ea,side:THREE.DoubleSide,roughness:.9,flatShading:true});
const confMats=[0xff6b57,0xffcf6e,0x1fb5a7,0x8fb5ff].map(c=>std(c,{roughness:.6}));
const partGeo={
  dust:new THREE.SphereGeometry(.075,6,5),
  spark:new THREE.OctahedronGeometry(.055),
  splash:new THREE.SphereGeometry(.09,6,5),
  feather:new THREE.PlaneGeometry(.16,.34),
  confetti:new THREE.BoxGeometry(.1,.02,.14),
};
const partPool={};
for(const k in partGeo){
  const items=[];
  const n=k==='feather'||k==='confetti'?26:40;
  for(let i=0;i<n;i++){
    const m=new THREE.Mesh(partGeo[k],
      k==='confetti'?pick(confMats):(k==='spark'?sparkMat:(k==='splash'?splashMat:(k==='feather'?featherMat:dustMat))));
    m.visible=false; m.castShadow=false; scene.add(m); items.push(m);
  }
  partPool[k]={items,get(){ for(const m of items) if(!m.visible){ m.visible=true; return m; } return null; }};
}
function spawnPart(type,x,y,z,o={}){
  const m=partPool[type].get(); if(!m) return;
  m.position.set(x,y,z);
  m.rotation.set(rand(TAU),rand(TAU),rand(TAU));
  m.scale.setScalar(o.s||1);
  PARTS.push({m,type,vx:o.vx??rand(-1.4,1.4),vy:o.vy??rand(1,3),vz:o.vz??rand(-.5,1.5),
    g:o.g??7,life:o.life??rand(.4,.7),t:0,s:o.s||1,sway:o.sway||0,rs:o.rs??rand(-6,6)});
}
function burst(type,x,y,z,n,o={}){
  for(let i=0;i<n;i++){
    const a=rand(TAU),r=rand(.5,1);
    spawnPart(type,x+Math.cos(a)*.2,y+rand(0,.3),z+Math.sin(a)*.2,
      Object.assign({vx:Math.cos(a)*r*2.4,vy:rand(1.5,4)*(o.up||1),vz:Math.sin(a)*r*2.4},o));
  }
}
function updateParticles(dtw,dt){
  for(let i=PARTS.length-1;i>=0;i--){
    const p=PARTS[i]; p.t+=dtw;
    if(p.t>=p.life){ p.m.visible=false; PARTS.splice(i,1); continue; }
    p.vy-=p.g*dtw;
    p.m.position.x+=p.vx*dtw; p.m.position.y+=p.vy*dtw; p.m.position.z+=(p.vz+S.speed)*dtw;
    if(p.m.position.y<.03&&p.type!=='feather'){ p.m.position.y=.03; p.vy*=-.3; p.vx*=.8; }
    if(p.sway){ p.m.rotation.x+=dtw*3; p.m.rotation.z+=dtw*p.rs; p.m.position.x+=Math.sin(p.t*9)*dtw*p.sway; p.vy=Math.max(p.vy,-1.2); }
    else p.m.rotation.z+=p.rs*dtw;
    const k=1-p.t/p.life;
    p.m.scale.setScalar(Math.max(.001,p.s*k));
  }
  /* 高速流光 */
  const on=S.speed>19&&S.mode!=='title';
  lineMat.opacity=damp(lineMat.opacity,on?clamp((S.speed-19)/12,0,1)*.5:0,6,dt);
  if(on) for(const l of lines){
    l.position.z+=S.speed*dt*1.18;
    if(l.position.z>10){
      l.position.set(S.px+pick([-1,1])*rand(2.6,5.5),rand(.4,3.4),-14-rand(8));

  }
}

let dustT=0;
function updatePlayer(dtw,dt){
  // 横向
  const dir=(S.held.r?1:0)-(S.held.l?1:0);
  if(dir) S.pvx+=dir*32*dtw; else S.pvx=damp(S.pvx,0,9,dtw);
  S.pvx=clamp(S.pvx,-11,11);
  S.px+=S.pvx*dtw;
  if(S.px>4.15){ S.px=4.15; S.pvx*=-.25; }
  if(S.px<-4.15){ S.px=-4.15; S.pvx*=-.25; }
  // 跳跃缓冲
  S.jumpBuf-=dtw;
  if(S.jumpBuf>0){
    if(S.grounded){
      S.jumpBuf=0; S.grounded=false; S.pvy=CONF.jumpV; S.canFlap=true;
      AU.jump(); burst('dust',S.px,.08,.8,6,{vy:rand(.8,1.6),g:4});
    }else if(S.canFlap){
      S.jumpBuf=0; S.canFlap=false; S.pvy=Math.max(S.pvy,CONF.flapV); S.flapT=0;
      AU.flap(); burst('spark',S.px,1.6,-.2,5,{g:2});
    }
  }
  // 重力
  if(!S.grounded){
    S.pvy-=CONF.grav*dtw;
    S.py+=S.pvy*dtw;
    if(S.py<=0){
      S.py=0; S.grounded=true;
      if(S.pvy<-4){ TILT.scale.y=.76; AU.land(); burst('dust',S.px,.06,.8,9,{vy:rand(.6,1.4),g:4}); }
      else if(S.pvy<-1){ TILT.scale.y=.86; }
      S.pvy=0; S.canFlap=true;
    }
  }
  // 速度
  S.boostT=Math.max(0,S.boostT-dtw);
  S.magnetT=Math.max(0,S.magnetT-dtw);
  S.slowT=Math.max(0,S.slowT-dtw);
  S.invT=Math.max(0,S.invT-dtw);
  S.comboT-=dtw; if(S.comboT<=0&&S.combo>0) S.combo=0;
  const target=CONF.baseSpeed+CONF.speedRamp*(1-Math.exp(-S.dist/CONF.speedExp));
  S.speedMul=damp(S.speedMul,1,.7,dtw);
  let sp=target*S.speedMul;
  if(S.boostT>0) sp*=1.38;
  if(S.slowT>0) sp*=.7;
  if(S.held.brake) sp*=.8;
  if(S.mode==='dying') sp=1.5;
  S.speed=damp(S.speed,sp,S.mode==='dying'?3:2,dtw);
  S.dist+=S.speed*dtw;
  S.score+=S.speed*dtw;
  S.pedalPhase+=S.speed*dtw*.62;
  // 受击无敌闪烁
  const blink=S.invT>0&&Math.sin(S.t*30)>0;
  PEL.g.visible=BIKE.g.visible=!blink;
  // 尘土 / 加速火花
  dustT-=dtw;
  if(dustT<=0&&S.grounded&&S.speed>3){
    spawnPart('dust',S.px+rand(-.2,.2),.06,1,rand(-.2,.2),{vy:rand(.3,.9),g:3,life:.5,s:rand(.7,1.3)});
    dustT=.09;
  }
  if(S.boostT>0&&Math.random()<dtw*30)
    spawnPart('spark',S.px+rand(-.35,.35),.3+rand(.5),1,{vy:rand(.5,2),g:3,life:.45,s:rand(.6,1.2)});
  // 里程碑
  if(S.dist>=S.mileNext){
    toast(S.mileNext+' m · 一路向前！',S.mileNext%1000===0?'gold':'');
    AU.mile();
    if(S.mileNext%1000===0) burst('confetti',S.px,2.2,.5,26,{g:5,up:1.4});
    S.mileNext+=500;
  }
  // 新手引导
  if(!S.tutDone&&S.inputs>4){ S.tutDone=true; LS.set('tut',true); show(D.tut,false); }
}

const camLook=new THREE.Vector3(0,1.5,-8);
let orbA=0;
function updateCamera(dt){
  let cx,cy,cz,lx,ly,lz,fov;
  if(S.mode==='title'){
    const a=Math.sin(S.t*.13)*.6;
    cx=Math.sin(a)*6.4+1.4; cz=Math.cos(a)*6.4+.9; cy=1.9+Math.sin(S.t*.37)*.3;
    lx=2.6; ly=1.9; lz=-.8; fov=52;
  }else if(S.mode==='dying'||S.mode==='over'){
    orbA+=dt*.55;
    cx=S.px+Math.sin(orbA)*5.6; cz=Math.cos(orbA)*5.6; cy=2.5;
    lx=S.px; ly=1.3; lz=0; fov=52;
  }else{
    cx=S.px*.55; cy=3.05+S.py*.35; cz=7.1;
    lx=S.px*.8; ly=1.35+S.py*.4; lz=-8;
    fov=62+clamp((S.speed-13)/16,0,1)*9+(S.boostT>0?7:0);
  }
  S.shake=Math.max(0,S.shake-dt*2);
  const shx=(Math.random()-.5)*S.shake*.5, shy=(Math.random()-.5)*S.shake*.4;
  camera.position.x=damp(camera.position.x,cx+shx,3.5,dt);
  camera.position.y=damp(camera.position.y,cy+shy,3.5,dt);
  camera.position.z=damp(camera.position.z,cz,3.5,dt);
  camLook.x=damp(camLook.x,lx,5,dt);
  camLook.y=damp(camLook.y,ly,5,dt);
  camLook.z=damp(camLook.z,lz,5,dt);
  camera.lookAt(camLook);
  camera.fov=damp(camera.fov,fov,4,dt);
  camera.updateProjectionMatrix();
}

  D['buff-shield'].classList.toggle('on',S.shield);
  D['buff-magnet'].classList.toggle('on',S.magnetT>0);
  D['buff-boost'].classList.toggle('on',S.boostT>0);
  if(S.magnetT>0) magBarI.style.width=(S.magnetT/8*100)+'%';
  if(S.boostT>0) boostBarI.style.width=(S.boostT/3.4*100)+'%';
}
function syncSettings(){
  const s=S.muted?'🔇':'🔊', q=S.quality==='high'?'✨':'⚡';
  D['btn-sound-t'].textContent=s; D['btn-sound-p'].textContent=s;
  D['btn-quality-t'].textContent=q; D['btn-quality-p'].textContent=q;
}
/* ================= 游戏流程 ================= */
function hideScreens(){ show(D['scr-title'],false); show(D['scr-over'],false); show(D['scr-pause'],false); }
function updateBestLine(){
  D['best-line'].textContent=`🏆 最佳 ${S.best} 分 · 最远 ${Math.floor(S.bestDist)} m`;
}
function resetGame(attract){
  clearEnts();
  for(const p of PARTS) p.m.visible=false; PARTS.length=0;
  for(const f of FLY) f.m.visible=false; FLY.length=0;
  Object.assign(S,{dist:0,score:0,fish:0,combo:0,comboT:0,hearts:3,invT:0,shield:false,magnetT:0,
    boostT:0,px:0,pvx:0,py:0,pvy:0,grounded:true,canFlap:true,jumpBuf:0,speedMul:1,shake:0,
    mileNext:500,newRecord:false,slowT:0});
  if(!attract){ S.cycleT=0.02; S.speed=0; }
  nextEvDist=40; nextFishDist=15; nextPickDist=150; nextPadDist=100;
  PLAYER.root.position.set(0,0,0);
  TILT.rotation.set(0,0,0); TILT.scale.set(1,1,1);
  PEL.g.visible=BIKE.g.visible=true;
  renderHearts();
}
function showTitle(){
  hideScreens(); show(D.hud,false); show(D.touch,false); show(D.count,false);
  resetGame(true);
  S.mode='title';
  show(D['scr-title'],true);
  updateBestLine();
}
function startGame(){
  AU.ensure(); AU.startMusic(); AU.click();
  hideScreens(); show(D.hud,true);
  if(IS_TOUCH) show(D.touch,true);
  resetGame(false);
  S.mode='count'; S.countT=2.7; S.lastN=0;
  show(D.tut,!S.tutDone);
}
function showCount(v){
  D.count.textContent=v; show(D.count,true);
  D.count.classList.remove('zoom'); void D.count.offsetWidth; D.count.classList.add('zoom');
}
function pauseGame(){ if(S.mode!=='playing') return; S.mode='paused'; show(D['scr-pause'],true); AU.click(); }
function resumeGame(){ if(S.mode!=='paused') return; S.mode='playing'; show(D['scr-pause'],false); AU.click(); }
function goHome(){ AU.click(); showTitle(); }
function gameOver(){
  S.mode='over'; S.tsTarget=1;
  const sc=Math.floor(S.score), ds=Math.floor(S.dist);
  S.newRecord=sc>S.best;
  if(S.newRecord){ S.best=sc; LS.set('best',sc); }
  if(ds>S.bestDist){ S.bestDist=ds; LS.set('bestDist',ds); }
  S.totalFish+=S.fish; LS.set('totalFish',S.totalFish);
  D['ov-score'].textContent=sc; D['ov-dist'].textContent=ds;
  D['ov-fish'].textContent=S.fish; D['ov-best'].textContent=S.best;
  show(D['ov-new'],S.newRecord);
  show(D.hud,false); show(D.touch,false);
  show(D['scr-over'],true);
  if(S.newRecord) burst('confetti',S.px,2.2,.5,30,{g:5,up:1.4});
}
/* ================= 输入 ================= */
function pressJump(){ S.jumpBuf=.15; S.inputs++; }
function bell(){
  if(S.mode!=='playing'&&S.mode!=='title') return;
  AU.ensure(); AU.ding(); BIKE.bellS=1;
  for(const g of gulls) if(Math.abs(g.position.z)<50) g.userData.flee=rand(.6,1.4);
}
addEventListener('keydown',e=>{
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(e.code)) e.preventDefault();
  if(e.repeat) return;
  switch(e.code){
    case 'ArrowLeft': case 'KeyA': S.held.l=true; S.inputs++; break;
    case 'ArrowRight': case 'KeyD': S.held.r=true; S.inputs++; break;
    case 'Space': case 'ArrowUp': case 'KeyW': pressJump(); break;
    case 'ArrowDown': case 'KeyS': S.held.brake=true; break;
    case 'KeyH': bell(); break;
    case 'KeyP': case 'Escape': S.mode==='playing'?pauseGame():resumeGame(); break;
    case 'KeyM': toggleSound(); break;
    case 'KeyR': if(S.mode==='over'||S.mode==='paused') startGame(); break;
    case 'Enter': if(S.mode==='title'||S.mode==='over') startGame(); break;
  }
});
addEventListener('keyup',e=>{
  switch(e.code){
    case 'ArrowLeft': case 'KeyA': S.held.l=false; break;
    case 'ArrowRight': case 'KeyD': S.held.r=false; break;
    case 'Space': case 'ArrowUp': case 'KeyW': if(S.pvy>3.5) S.pvy*=.6; break;
    case 'ArrowDown': case 'KeyS': S.held.brake=false; break;
  }
});
function bindHold(el,on,off){
  el.addEventListener('pointerdown',e=>{ e.preventDefault(); on(); });
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>el.addEventListener(ev,off));
}
bindHold(D['btn-l'],()=>{ S.held.l=true; S.inputs++; },()=>S.held.l=false);
bindHold(D['btn-r'],()=>{ S.held.r=true; S.inputs++; },()=>S.held.r=false);
bindHold(D['btn-brake'],()=>S.held.brake=true,()=>S.held.brake=false);
bindHold(D['btn-j'],()=>pressJump(),()=>{ if(S.pvy>3.5) S.pvy*=.6; });
D['btn-bell'].addEventListener('pointerdown',e=>{ e.preventDefault(); bell(); });
D['btn-start'].addEventListener('click',startGame);
D['btn-again'].addEventListener('click',startGame);
D['btn-restart'].addEventListener('click',()=>{ show(D['scr-pause'],false); startGame(); });
D['btn-home'].addEventListener('click',goHome);
D['btn-home-p'].addEventListener('click',goHome);
D['btn-resume'].addEventListener('click',resumeGame);
D['btn-pause'].addEventListener('click',()=>{ S.mode==='playing'?pauseGame():resumeGame(); });
function toggleSound(){ AU.ensure(); AU.setMute(!S.muted); syncSettings(); AU.click(); }
function toggleQuality(){
  S.quality=S.quality==='high'?'fast':'high';
  applyQuality(); syncSettings();
  toast(S.quality==='high'?'✨ 画质：精致':'⚡ 画质：流畅');
}
D['btn-sound-t'].addEventListener('click',toggleSound);
D['btn-sound-p'].addEventListener('click',toggleSound);
D['btn-quality-t'].addEventListener('click',toggleQuality);
D['btn-quality-p'].addEventListener('click',toggleQuality);
addEventListener('pointerdown',()=>{ if(AU.ensure()) AU.startMusic(); });
document.addEventListener('visibilitychange',()=>{ if(document.hidden&&S.mode==='playing') pauseGame(); });
addEventListener('contextmenu',e=>e.preventDefault());
/* ================= 主循环 ================= */
let last=0, attractFishT=3;
renderer.setAnimationLoop(tms=>{
  const dt=clamp(((tms-last)||16)/1000,.001,.05); last=tms;
  S.tsTarget=S.mode==='dying'?.32:1;
  S.timeScale=damp(S.timeScale,S.tsTarget,6,dt);
  const dtw=dt*S.timeScale;
  if(S.mode!=='paused'&&S.mode!=='boot'){
    S.t+=dtw;
    if(S.mode==='title'){
      S.speed=damp(S.speed,6,1.2,dtw); S.dist+=S.speed*dtw; S.pedalPhase+=S.speed*dtw*.62;
      attractFishT-=dtw;
      if(attractFishT<=0){ fishRow(pickX(),CONF.spawnZ,randi(2,4)); attractFishT=rand(4,8); }
    }
    if(S.mode==='count'){
      S.countT-=dt;
      const n=Math.max(0,Math.ceil(S.countT/.8));
      if(n!==S.lastN&&n>0){ S.lastN=n; showCount(n); AU.tick(); }
      if(S.countT<=0){ S.mode='playing'; showCount('出发!'); AU.go(); setTimeout(()=>show(D.count,false),700); }
      S.speed=damp(S.speed,CONF.baseSpeed*.55,1.2,dtw);
    }
    if(S.mode==='playing'||S.mode==='dying'){ updatePlayer(dtw,dt); director(); }
    if(S.mode==='over') S.speed=damp(S.speed,0,2,dtw);
    updateEnts(dtw);
    updateCycle(dtw*(S.mode==='title'?.25:1));
    updateEnvironment(dtw,S.speed,dt);
    updateParticles(dtw,dt);
    updateFlyFish(dtw);
    poseRig(dtw);
    if(S.mode==='dying'){
      S.dieT-=dt;
      TILT.rotation.z=Math.sin(S.t*16)*.14*clamp(S.dieT/1.7,0,1);
      if(S.dieT<=0) gameOver();
    }
  }
  updateCamera(dt);
  if(S.mode==='playing'||S.mode==='count') updateHUD();
  if(AU.ctx) AU.setWind(clamp((S.speed-4)/34,0,1)+(S.boostT>0?.25:0));
  composer.render();
});
/* ================= 启动 ================= */
applyQuality(); syncSettings(); updateBestLine(); renderHearts();
window.__PR={S,CONF,PLAYER,BIKE,PEL,AU,camera,scene,ENT,PATTERNS,startGame,hitObstacle,collectFish,spawnEnt,showTitle};
window.__GAME_READY__=true;
document.getElementById('loader').classList.add('done');
showTitle();
console.log('%c鹈鹕骑行 Pelican Ride 🐦🚲','font-size:18px;color:#ff8f5e;font-weight:bold');
</script>

<script>
(function(){
  'use strict';
  var txt=document.getElementById('load-text'), sp=document.getElementById('load-spin');
  window.__loaderFail=function(msg){
    if(sp) sp.style.display='none';
    txt.innerHTML=msg;
  };
  function setLoad(s){ txt.innerHTML=s; }
  function to(ms){ var c=new AbortController(); setTimeout(function(){try{c.abort()}catch(e){}},ms); return c.signal; }
  var BASES=[
    'https://cdn.jsdelivr.net/npm/three@0.160.1/',
    'https://unpkg.com/three@0.160.1/',
    'https://registry.npmmirror.com/three/0.160.1/files/'
  ];
  var FILES=[
    'build/three.module.js',
    'examples/jsm/shaders/CopyShader.js',
    'examples/jsm/shaders/LuminosityHighPassShader.js',
    'examples/jsm/shaders/OutputShader.js',
    'examples/jsm/postprocessing/Pass.js',
    'examples/jsm/postprocessing/MaskPass.js',
    'examples/jsm/postprocessing/ShaderPass.js',
    'examples/jsm/postprocessing/RenderPass.js',
    'examples/jsm/postprocessing/EffectComposer.js',
    'examples/jsm/postprocessing/UnrealBloomPass.js',
    'examples/jsm/postprocessing/OutputPass.js',
    'examples/jsm/utils/BufferGeometryUtils.js'
  ];
  function norm(p){ var o=[]; p.split('/').forEach(function(x){ if(x==='.'||!x) return; else if(x==='..') o.pop(); else o.push(x); }); return o.join('/'); }
  function keyOf(spec, from){
    if(spec==='three') return 'build/three.module.js';
    if(spec.indexOf('three/addons/')===0) return 'examples/jsm/'+spec.slice(13);
    if(spec.charAt(0)==='.'){ var d=from.split('/').slice(0,-1).join('/'); return norm(d+'/'+spec); }
    return null;
  }
  var URLS={};
  function host(b){ var m=b.match(/https:\/\/([^/]+)/); return m?m[1]:b; }
  function fetchText(path){
    var i=0;
    function tryOne(){
      if(i>=BASES.length) return Promise.reject(new Error('CDN_FAIL'));
      var b=BASES[i++];
      setLoad('正在加载 3D 引擎 · '+host(b)+'<small>若长时间无响应请检查网络</small>');
      return fetch(b+path,{signal:to(15000)}).then(function(r){ if(!r.ok) throw 0; return r.text(); })
        .catch(function(){ return tryOne(); });
    }
    return tryOne();
  }
  function rewrite(src, fromKey){
    return src.replace(/(from\s*|import\s*|export\s*\*\s*from\s*)(["'])([^"'\n]+)\2/g,
      function(m,p,q,s){ var k=keyOf(s,fromKey); if(k&&URLS[k]) return p+q+URLS[k]+q; return m; });
  }
  function blob(src){ return URL.createObjectURL(new Blob([src],{type:'text/javascript'})); }
  window.addEventListener('error',function(e){
    if(!window.__GAME_READY__) window.__loaderFail('加载出错：'+((e&&e.message)||'未知错误')+'<br>请刷新重试');
  });
  function run(){
    var texts={}, i, j, k;
    var chain=Promise.resolve();
    FILES.forEach(function(path){
      chain=chain.then(function(){ return fetchText(path).then(function(t){ texts[path]=t; }); });
    });
    chain.then(function(){
      setLoad('正在装配模块…');
      for(j=0;j<FILES.length;j++){ k=FILES[j]; URLS[k]=blob(rewrite(texts[k],k)); }
      var gameSrc=document.getElementById('game-code').textContent;
      var s=document.createElement('script'); s.type='module';
      s.textContent=rewrite(gameSrc,'game');
      document.body.appendChild(s);
      var n=0, iv=setInterval(function(){
        n++;
        if(window.__GAME_READY__){ clearInterval(iv); return; }
        if(n>130){ clearInterval(iv); window.__loaderFail('加载超时，请检查网络后刷新。'); }
      },300);
    }).catch(function(e){
      console.error(e);
      window.__loaderFail('无法加载 three.js（游戏需要联网获取 3D 引擎）。<br>请检查网络后刷新重试。');
    });
  }
  run();
})();
</script>
